<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120a06">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lift Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-column phone app. Look: lacquered dark wood, smoked-glass panels, chrome trim, deep-orange recessed LED glow. */
:root{
  --bg:#120a06;
  --surface:rgba(66,39,23,.58);
  --surface2:rgba(22,11,6,.55);
  --line:rgba(240,212,180,.15);
  --text:#f4ede5;
  --muted:#ab9a8a;
  --accent:#ff6a14;
  --accent-soft:#ff9348;
  --accent-ink:#2a1405;
  --pool:#2fc4be;
  --good:#5bd39b;
  --good-ink:#052214;
  --bad:#e8706a;
  --chrome:linear-gradient(180deg,#fcfcfd 0%,#dcdfe4 36%,#9ba1aa 52%,#e9ebee 76%,#b9bec6 100%);
  --f-display:'Helvetica Neue',Helvetica,Arial,system-ui,-apple-system,sans-serif;
  --f-body:'Helvetica Neue',Helvetica,Arial,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
/* the wood: ombre planks, fine grain, a soft lacquer reflection */
/* background: a real material photo (bg.jpg) when present, under soft lighting; a plain deep ombre until then */
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:
    linear-gradient(180deg,rgba(8,3,1,.5) 0%,rgba(8,3,1,.1) 24%,rgba(8,3,1,.45) 66%,rgba(5,2,1,.88) 100%),
    radial-gradient(90% 36% at 50% -4%,rgba(255,138,48,.2),transparent 70%),
    linear-gradient(180deg,#34190d 0%,#1f0f07 45%,#100804 100%)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(130% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.display{font-family:var(--f-display);font-weight:300;letter-spacing:-.02em;line-height:1.05;margin:0}
h1.display{font-size:40px}
h2.display{font-size:22px;font-weight:400}
h1.display,.rname,.bestnum{color:#fff}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:12px}
.top>.eyebrow{flex:1;text-align:center}
.link{color:var(--muted);font-weight:500;min-height:44px;padding:0 4px;display:inline-flex;align-items:center}
.link:hover{color:var(--text)}
.link:disabled{opacity:.35;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,235,210,.05);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.iconbtn.on{border-color:var(--accent);color:var(--accent-soft)}
.stack{display:flex;flex-direction:column;gap:14px;isolation:isolate}
.card{position:relative;background:linear-gradient(180deg,rgba(104,64,38,.5),rgba(46,26,15,.74));border:1px solid var(--line);border-top-color:rgba(255,234,210,.26);border-radius:20px;padding:16px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,240,222,.08),0 16px 28px -16px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px) saturate(115%);backdrop-filter:blur(14px) saturate(115%)}
.notice{background:rgba(22,11,6,.55);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--muted);font-size:14px;margin-bottom:12px}
.btn{min-height:50px;padding:0 20px;border-radius:15px;font-weight:500;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4}
.btn-primary{background:var(--chrome);color:#2b1608;box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.25),0 8px 20px -8px rgba(255,106,20,.7)}
.btn-ghost{background:rgba(255,235,210,.05);border:1px solid rgba(240,222,200,.26);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.btn-danger{background:var(--bad);color:#2a0807}
.btn.wide{width:100%}
.field{width:100%;min-height:50px;background:rgba(18,9,5,.6);border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:17px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
.field::placeholder{color:var(--muted)}
textarea.field{padding:12px 14px;min-height:88px;resize:vertical}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.mdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid rgba(240,222,200,.2);background:rgba(20,10,5,.45)}

/* routine cards: floating panels with recessed LED underneath */
.rcard{display:flex;flex-direction:column;gap:16px;margin-bottom:12px;background:linear-gradient(180deg,rgba(116,72,43,.5),rgba(48,27,16,.62));border-color:rgba(255,236,214,.2)}
.rcard::before{content:none}
.rcard::after{content:'';position:absolute;left:18px;right:18px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,150,70,.55),transparent);pointer-events:none}
.rmain{display:flex;flex-direction:column;gap:7px;cursor:pointer}
.rname{font-size:34px;font-weight:600;letter-spacing:-.025em}
.rmeta{color:var(--muted);font-size:14px}
.ractions{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.ractions.three{grid-template-columns:1.6fr 1fr 50px}
.ractions .iconbtn{width:50px;height:50px;border-radius:15px}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:500;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:14px}
button.row{width:100%;text-align:left}

/* steppers */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap{display:block;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.step{display:flex;align-items:center;background:rgba(18,9,5,.6);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
.sb{width:42px;height:46px;font-size:22px;font-weight:300;flex:none;color:var(--accent-soft)}
.sb:active{background:rgba(255,235,210,.1)}
.sv{flex:1;min-width:0;width:100%;height:46px;text-align:center;background:transparent;border:0;font-family:var(--f-display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums}
.sv:focus{outline:none;background:rgba(0,0,0,.35)}
.step.sm .sb{width:30px;font-size:20px}
.step.sm .sv{font-size:21px}

/* sets */
.set{display:flex;flex-direction:column;gap:12px;border-width:1.5px}
.set.st-done{border-color:var(--good);box-shadow:inset 0 1px 0 rgba(255,240,222,.08),0 14px 28px -16px rgba(0,0,0,.9),0 0 18px -6px rgba(91,211,155,.45)}
.set.st-skipped{border-color:var(--bad)}
.set-top{display:flex;justify-content:space-between;align-items:baseline}
.set-n{font-weight:500;font-size:19px;letter-spacing:-.01em}
.set-s{font-size:13px;font-weight:500;color:var(--muted)}
.st-done .set-s{color:var(--good)}
.st-skipped .set-s{color:var(--bad)}
.set-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.did,.didnt{border:1px solid rgba(240,222,200,.24);color:var(--text);background:rgba(255,235,210,.04)}
.did.on{background:var(--good);color:var(--good-ink);border-color:var(--good)}
.didnt.on{background:var(--bad);color:#2a0807;border-color:var(--bad)}

/* exercise header, best lift, charts */
.exhead{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bestnum{font-family:var(--f-display);font-size:46px;font-weight:300;line-height:1}
.bestnum small{font-size:19px;font-weight:400;margin-left:5px;-webkit-text-fill-color:var(--muted);color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent-soft);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(255,106,20,.6))}
.chart .pt{fill:#fff2e4}
.chart .base{stroke:var(--line);stroke-width:1}
.spark{width:84px;height:28px;flex:none}
.spark .ln{fill:none;stroke:var(--accent-soft);stroke-width:2;stroke-linejoin:round}
.links{display:flex;gap:20px;justify-content:center;margin:2px 0}

/* segmented, chips */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(18,9,5,.55);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:11px;font-weight:500;color:var(--muted)}
.seg button.on{background:linear-gradient(180deg,rgba(255,235,210,.16),rgba(255,235,210,.07));color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;padding-inline:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,235,210,.05);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--chrome);color:#2b1608;border-color:transparent}
.chip.sm{min-height:34px;padding:0 11px;font-size:14px}

/* editor */
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ihead .nm{flex:1;min-width:0;font-weight:500;font-size:17px;overflow-wrap:anywhere}
.tiny{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);color:var(--muted);font-size:16px;flex:none}
.tiny:disabled{opacity:.35}
.grip{width:40px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab;flex:none;-webkit-user-select:none;user-select:none}
.grip:active{color:var(--accent-soft)}
.card.dragging{z-index:40;box-shadow:0 26px 44px -10px rgba(0,0,0,.95),0 0 0 1px var(--accent),0 0 26px -4px rgba(255,106,20,.6);transition:none;cursor:grabbing}
.card.shift{transition:transform .18s ease}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:end;margin-bottom:8px}
.setrow.three{grid-template-columns:26px 1.15fr 1fr 1fr;gap:6px}
.setrow .sn{font-weight:500;font-size:18px;color:var(--muted);padding-bottom:12px}

/* fixed bars */
.bar,.tabbar,.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:linear-gradient(to top,rgba(15,7,3,.96) 62%,transparent);padding-top:18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in,.tabbar-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.tabbar{background:linear-gradient(180deg,rgba(34,18,10,.9),rgba(14,7,3,.97));border-top:1px solid rgba(255,236,214,.16);box-shadow:0 -1px 0 rgba(0,0,0,.6),0 -12px 24px -12px rgba(255,106,20,.14);padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tabbar-in{gap:2px}
.tab{flex:1;min-height:48px;border-radius:13px;font-weight:500;font-size:13px;letter-spacing:.01em;color:var(--muted);min-width:0}
.tab.on{color:var(--text)}
.tab.on .tl{border-bottom:2px solid var(--accent);padding-bottom:3px;box-shadow:0 7px 10px -7px var(--accent)}
.dock{background:linear-gradient(180deg,rgba(34,18,10,.92),rgba(14,7,3,.98));border-top:1px solid rgba(255,236,214,.16);padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock-btns{display:flex;gap:10px}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.live>div{background:rgba(18,9,5,.6);border:1px solid var(--line);border-radius:13px;padding:7px 10px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.live .v{font-size:22px;font-weight:300;line-height:1.05;letter-spacing:-.01em}
.live .l{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:2px}
.spacer{height:190px}

/* rest timer */
.rest{position:relative;width:100%;background:linear-gradient(180deg,#ff9448,#e4570f);color:var(--accent-ink);border-radius:16px;overflow:hidden;box-shadow:0 0 22px -4px rgba(255,106,20,.7)}
.rest-fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.24);width:100%}
.rest-in{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px}
.rest .eyebrow{color:rgba(42,20,5,.78)}
.rest-time{font-size:38px;font-weight:300;-webkit-text-fill-color:currentColor}
.rest-btns{display:flex;gap:6px}
.rest-btns button{min-height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:rgba(42,20,5,.16);font-weight:600;color:var(--accent-ink)}
.rest.done{background:linear-gradient(180deg,#76e0ae,#34b479);color:var(--good-ink);animation:flash .6s ease-in-out 4}
.rest.done .eyebrow{color:rgba(5,34,20,.78)}
@keyframes flash{50%{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.rest.done{animation:none}}

/* sheet and toast */
.scrim{position:fixed;inset:0;background:rgba(8,3,1,.7);z-index:50;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;margin:0 auto;max-width:560px;background:linear-gradient(180deg,#3a2112,#1d0f07);border:1px solid rgba(255,236,214,.2);border-bottom:0;border-radius:24px 24px 0 0;padding:22px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:82vh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.sheet p{margin:0;color:var(--muted)}
.sheet-btns{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:linear-gradient(180deg,#f7efe6,#d8cbbb);color:#2a1405;padding:10px 18px;border-radius:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{background:linear-gradient(180deg,rgba(104,64,38,.46),rgba(46,26,15,.7));border:1px solid var(--line);border-top-color:rgba(255,234,210,.22);border-radius:18px;padding:14px;min-width:0;box-shadow:0 14px 26px -16px rgba(0,0,0,.9)}
.stat .v{font-size:32px;font-weight:300;line-height:1.05;letter-spacing:-.02em}
.stat .l{font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
.pr{color:var(--accent-soft);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.up{color:var(--good);font-weight:500}
.down{color:var(--bad);font-weight:500}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:8px}
.skel{height:130px;border-radius:20px;background:rgba(90,54,32,.35);border:1px solid var(--line)}
.sec{margin:24px 0 8px}

/* library: thumbnails, frames, body map */
.thumb{width:62px;height:62px;border-radius:15px;flex:none;background-color:#1a0d07;background-size:200% 100%;background-position:0 0;border:1px solid rgba(255,236,214,.2);filter:grayscale(1) sepia(.5) contrast(1.06) brightness(.96);box-shadow:0 8px 16px -8px rgba(0,0,0,.9)}
.thumb.ph{background-image:none;display:flex;align-items:center;justify-content:center;color:var(--muted);filter:none}
.frames{width:100%;aspect-ratio:2/1;border-radius:18px;background-color:#1a0d07;background-size:100% 100%;border:1px solid rgba(255,236,214,.2);filter:grayscale(1) sepia(.5) contrast(1.06) brightness(.96);position:relative}
.framelab{display:flex;justify-content:space-around;margin-top:6px}
.bodymap{width:100%;height:auto;display:block;max-width:420px;margin:0 auto;overflow:visible}
.bodymap .base{fill:url(#bmFill);stroke:url(#bmChrome);stroke-width:1.3}
.bodymap .reg{cursor:pointer;-webkit-tap-highlight-color:transparent}
.bodymap .reg path,.bodymap .reg ellipse{fill:rgba(255,222,190,.075);stroke:rgba(222,226,232,.42);stroke-width:1;transition:fill .15s,stroke .15s}
.bodymap .reg:hover path,.bodymap .reg:active path,.bodymap .reg:hover ellipse,.bodymap .reg:active ellipse{fill:rgba(255,106,20,.5);stroke:#ffb98a;filter:drop-shadow(0 0 7px rgba(255,106,20,.85))}
.bodymap .lead{stroke:rgba(222,226,232,.45);stroke-width:.8;fill:none}
.bodymap .ldot{fill:#ff9348}
.bodymap .lab{fill:#eadccd;font:500 10.5px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.16em;cursor:pointer}
.bodymap .lab:hover{fill:#ffb98a}
.bodymap .head{fill:url(#bmFill);stroke:url(#bmChrome);stroke-width:1.3}

/* coach */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%;padding:11px 14px;border-radius:18px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,#8a4a24,#5a2c14);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:linear-gradient(180deg,rgba(104,64,38,.5),rgba(46,26,15,.74));border:1px solid var(--line);border-bottom-left-radius:6px}
.msg p{margin:0 0 8px}
.msg p:last-child{margin:0}
.msg ul{margin:0 0 8px;padding-left:20px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:10px;display:block}
.prop{border:1px dashed rgba(255,147,72,.7)}
.composer{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:19;background:rgba(15,7,3,.94);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px))}
.composer-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.composer-row{display:flex;gap:8px;align-items:flex-end}
textarea.chat-in{flex:1;min-width:0;min-height:50px;height:50px;max-height:120px;padding:13px 14px;resize:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

.row .thumb,.ihead .thumb{width:48px;height:48px;border-radius:12px}
.steps{margin:8px 0 0;padding-left:20px}
.steps li{margin:8px 0;line-height:1.45}
.libhint{text-align:center;margin:10px 0 4px;font-size:14px}

/* v6 */
.mf{display:flex;flex-direction:column;gap:6px;min-width:0}
.mf>span{font-size:13px;color:var(--muted)}
.mfgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mfd{margin-top:12px}
.mfd summary{cursor:pointer;color:var(--text);padding:6px 0}
.mf .field{min-height:44px;font-size:16px}
/* v4 */
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:active{background:rgba(255,236,214,.06)}
.mrow .chev{color:var(--muted);align-self:center;margin-left:2px}
.tapnum{cursor:pointer}
table.seg2 tr.tap td:first-child{color:#fff}
.exhead.hasthumb{flex-direction:row;align-items:flex-start;justify-content:space-between;gap:14px}
.exmain{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.exthumb{position:relative;flex:none;width:76px;height:76px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,236,214,.28);box-shadow:0 10px 18px -10px #000;background:#1a0d07}
.exthumb-img{position:absolute;inset:0;background-size:200% 100%;background-position:0 0;filter:grayscale(1) sepia(.5) contrast(1.06) brightness(.96)}
.exthumb-hint{position:absolute;left:0;right:0;bottom:0;padding:9px 0 4px;text-align:center;font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75))}
.stack.tight{gap:10px}
.card.cmp{padding:12px 12px 8px}
.cmp .ihead{margin-bottom:8px}
.cmp .tools{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cmp .tools .seg{flex:none;width:118px;padding:2px}
.cmp .tools .seg button{min-height:32px;font-size:13px}
.cmp .tools .chips{flex:1;min-width:0;padding-bottom:0}
.cmp .chip.sm{min-height:32px;padding:0 10px}
.cmp .setrow{margin-bottom:6px}
.cmp .setrow:not(.first) .cap{display:none}
.cmp .setrow .sn{padding-bottom:9px;font-size:16px}
.cmp .sb{height:36px}
.cmp .sv{height:36px;font-size:18px}
.cmp .setrow{margin-bottom:5px}
.seg4 button{font-size:14px;padding:0 2px}
.cmp .links{margin:0;min-height:36px;align-items:center}
.pool{--accent:var(--pool);--accent-soft:var(--pool)}
.pool .chart .ln{filter:drop-shadow(0 0 4px rgba(47,196,190,.55))}
.mrows{display:flex;flex-direction:column}
.mrow{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .k{flex:1;min-width:0;color:var(--muted)}
.mrow .v{font-weight:500;font-variant-numeric:tabular-nums}
.mrow .d{width:74px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .d.pos{color:var(--pool)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tri div{background:rgba(18,9,5,.45);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.tri b{display:block;font-size:22px;font-weight:300;color:#fff;font-variant-numeric:tabular-nums}
.tri span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
table.seg2{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
table.seg2 th{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 0}
table.seg2 th:first-child,table.seg2 td:first-child{text-align:left;color:var(--muted)}
table.seg2 td{text-align:right;padding:8px 0;border-top:1px solid var(--line)}
.bodymap{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;overflow:visible}
.bodymap .out{fill:#140905;stroke:rgba(240,214,180,.5);stroke-width:2.5}
.bodymap .pas path{fill:#3b2417;stroke:rgba(240,214,180,.16);stroke-width:1}
.bodymap .pas.face path{fill:#5b3a27}
.bodymap .pas.hairp path{fill:#120805}
.bodymap .reg path{fill:url(#bmMuscle);stroke:transparent;stroke-width:6;cursor:pointer;transition:fill .15s}
.bodymap .reg:hover path,.bodymap .reg:active path{fill:#ff8a3c;filter:drop-shadow(0 0 10px rgba(255,106,20,.85))}
.bodymap .lead{stroke:rgba(222,226,232,.5);stroke-width:2.2;fill:none}
.bodymap .ldot{fill:#ff9348}
.bodymap .lab{fill:#eadccd;font:500 28px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.14em;cursor:pointer}
</style>

  function history(exId, exceptSid) {
    // One point per finished session: best done set. Reps exercises use weight, timed ones use seconds.
    var pts = [];
    D('sessions').forEach(function (s) {
      if (!s.finishedAt || s.id === exceptSid) return;
      var it = s.items.find(function (i) { return i.exId === exId; });
      if (!it) return;
      var done = it.sets.filter(function (x) { return x.status === 'done'; });
      if (!done.length) return;
      var timed = it.mode === 'time';
      var best = done.reduce(function (a, b) {
        var av = timed ? a.secs : a.kg, bv = timed ? b.secs : b.kg;
        if (bv > av) return b;
        if (bv === av && !timed && b.reps > a.reps) return b;
        return a;
      });
      pts.push({ ts: s.finishedAt, v: timed ? best.secs : best.kg, reps: best.reps, timed: timed, sid: s.id, done: done });
    });
    return pts.sort(function (a, b) { return a.ts - b.ts; });
  }
  function lastSessionItem(exId) {
    var past = D('sessions').filter(function (s) {
      return s.finishedAt && s.items.some(function (i) { return i.exId === exId && i.sets.some(function (x) { return x.status === 'done'; }); });
    }).sort(function (a, b) { return b.finishedAt - a.finishedAt; })[0];

  /* ---------- charts ---------- */
  function areaChart(pts, fmt, what) {
    var W = 320, H = 132, pl = fmt ? 50 : 36, pr = 12, pt = 14, pb = 24;

    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    var span = hi - lo; if (span === 0) span = Math.max(1, hi * 0.1);
    var yMin = lo - span * 0.25, yMax = hi + span * 0.25;
    if (yMin < 0) yMin = 0;
    function X(i) { return pl + (pts.length === 1 ? 0 : i * (W - pl - pr) / (pts.length - 1)); }
    function Y(v) { return pt + (1 - (v - yMin) / (yMax - yMin)) * (H - pt - pb); }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
    var area = line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + (H - pb) + ' L' + X(0).toFixed(1) + ' ' + (H - pb) + ' Z';
    var last = pts[pts.length - 1];
    var label = fmt || function (v) { return pts[0].timed ? v + 's' : kgText(v); };
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(what || 'Best lift over time') + ', from ' + esc(label(pts[0].v)) + ' to ' + esc(label(last.v)) + '">';
    s += '<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.45"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>';
    s += '<line class="base" x1="' + pl + '" y1="' + (H - pb) + '" x2="' + (W - pr) + '" y2="' + (H - pb) + '"/>';
    s += '<path d="' + area + '" fill="url(#gA)"/>';
    s += '<path class="ln" d="' + line + '"/>';
    s += '<circle class="pt" cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) + '" r="4.5"/>';

    var more = LIB.filter(function (l) {

    }).slice(0, q ? 40 : 24);

      }).join('') + '</div>';
    }
    return h || '<div class="empty">No exercise matches. Create your own below.</div>';
  }
  function pickerView() {
    var p = state.picker;
    var present = MUSCLES.filter(function (m) { return D('exercises').some(function (e) { return e.muscle === m; }); });
    var h = '<header class="top"><button class="link" data-act="closePicker">‹ Back</button><span></span><span></span></header>';

    h += '<div class="chips"><button class="chip ' + (p.muscle === 'All' ? 'on' : '') + '" data-act="pickMuscle" data-m="All">All</button>' +
      present.map(function (m) { return '<button class="chip ' + (p.muscle === m ? 'on' : '') + '" data-act="pickMuscle" data-m="' + m + '"><span class="mdot" style="background:' + mcol(m) + '"></span>' + m + '</button>'; }).join('') + '</div>';
    h += '<div class="card" id="pick-list">' + pickList() + '</div>';
    h += '<section class="card stack"><h2 class="display">Your own exercise</h2>' +
      '<input id="custom-name" class="field" placeholder="Exercise name" value="' + esc(p.customName) + '" aria-label="New exercise name" maxlength="50">' +
      '<div class="chips">' + MUSCLES.map(function (m) { return '<button class="chip ' + (p.customMuscle === m ? 'on' : '') + '" data-act="customMuscle" data-m="' + m + '"><span class="mdot" style="background:' + mcol(m) + '"></span>' + m + '</button>'; }).join('') + '</div>' +
      '<button class="btn btn-primary" data-act="createEx">Create and add</button></section></div>';
    return h;
  }

  function workoutView() {
    var s = activeSession();
    if (!s) { state.view = { name: 'home' }; return homeView(); }
    return s.stage === 'active' ? activeView(s) : preView(s);
  }

  function targetText(st, it) {
    if (it.mode === 'time' || !st.tMax) return '';
    return 'Target ' + rr({ reps: st.tMin, repsMax: st.tMax }) + ' reps';
  }
  function hintFor(it) {
    if (it.mode === 'time') return '';
    var last = lastSessionItem(it.exId);
    if (!last || last.mode === 'time') return '';
    var top = it.sets[0] && it.sets[0].tMax;
    if (!top || !last.sets.length) return '';
    var allDone = last.sets.every(function (x) { return x.status === 'done' && (x.reps || 0) >= top; });
    return allDone ? 'You reached ' + top + ' reps on every set last time. Try adding 2.5 kg today.' : '';
  }

  function exHeadHtml(it, extra) {
    var l = libOf(exOf(it.exId));
    var th = l ? '<button class="exthumb" data-act="exInfo" data-id="' + esc(l.id) + '" aria-label="How to do ' + esc(it.name) + '"><span class="exthumb-img" style="background-image:url(\'' + imgUrl(l) + '\')"></span><span class="exthumb-hint">Form</span></button>' : '';
    return '<div class="exhead hasthumb"><div class="exmain"><div><span class="pill"><span class="mdot" style="background:' + mcol(it.muscle) + '"></span>' + esc(it.muscle) + '</span></div><h1 class="display">' + esc(it.name) + '</h1>' + (extra || '') + '</div>' + th + '</div>';
  }
  function preView(s) {
    var it = s.items[s.idx], ex = exOf(it.exId);
    var hist = history(it.exId);
    var h = '<header class="top"><button class="link" data-act="quitAsk">‹ Exit</button><div class="eyebrow">Exercise ' + (s.idx + 1) + ' of ' + s.items.length + '</div>' +
      '<button class="iconbtn ' + (state.noteOpen ? 'on' : '') + '" data-act="toggleNote" aria-label="Notes" aria-pressed="' + state.noteOpen + '">' + ICON_NOTE + '</button></header>';
    h += exHeadHtml(it);
    h += '<div class="stack">';
    h += '<button class="btn btn-ghost wide" data-act="exlist">Choose another exercise ▾</button>';
    var hint = hintFor(it);
    if (hint) h += '<div class="notice" style="margin:0;color:var(--good);border-color:var(--good)">' + esc(hint) + '</div>';
    if (state.noteOpen) {
      h += '<textarea id="note-ta" class="field" placeholder="Your notes: seat height, grip, cues to remember" aria-label="Exercise notes">' + esc(ex && ex.note ? ex.note : '') + '</textarea>';
    } else if (ex && ex.note) {

    }
    it.sets.forEach(function (st, j) {
      h += '<div class="card"><div class="set-top" style="margin-bottom:10px"><span class="set-n">Set ' + (j + 1) + '</span><span class="set-s">' + esc(targetText(st, it)) + '</span></div><div class="set-grid">' + setFields('w', s.idx, j, st, it.mode) + '</div></div>';
    });
    h += '<div class="links"><button class="link" data-act="wAddSet">+ Add set</button><button class="link" data-act="wDelSet"' + (it.sets.length <= 1 ? ' disabled' : '') + '>− Remove set</button></div>';
    h += '<section class="card"><div class="eyebrow">' + (it.mode === 'time' ? 'Longest hold' : 'Best lift') + '</div>';
    if (hist.length) {
      var best = hist.reduce(function (a, b) { return (b.v > a.v || (b.v === a.v && b.reps > a.reps)) ? b : a; });
      h += '<div class="bestnum num" style="margin-top:6px">' + (best.timed ? best.v + '<small>s</small>' : kgText(best.v) + '<small>kg x ' + best.reps + '</small>') + '</div><div class="muted">' + esc(fmtDate(best.ts)) + '</div>';
      h += hist.length > 1 ? areaChart(hist) : '<div class="muted" style="margin-top:10px">One session logged. Your trend line appears after the next one.</div>';
    } else {
      h += '<div class="muted" style="margin-top:6px">No history yet. Your first session sets the baseline.</div>';
    }
    h += '</section>';
    h += '</div>';
    return h + dock(s, '<button class="btn btn-primary wide" data-act="startEx">Start exercise</button>');
  }

  function nextIdx(s) {
    var n = s.items.length;
    for (var k = 1; k < n; k++) {
      var i = (s.idx + k) % n;
      if (s.items[i].sets.some(function (x) { return x.status === 'todo'; })) return i;
    }
    return -1;
  }

  function activeView(s) {
    var it = s.items[s.idx];
    var last = lastSessionItem(it.exId);
    var lastTxt = '';
    if (last) {
      var done = last.sets.filter(function (x) { return x.status === 'done'; });
      var b = done.reduce(function (a, c) { return (last.mode === 'time' ? c.secs > a.secs : c.kg > a.kg) ? c : a; });
      lastTxt = last.mode === 'time' ? b.secs + ' s' : kgText(b.kg) + ' kg x ' + b.reps;
    }
    var ni = nextIdx(s);
    var all = it.sets.every(function (x) { return x.status !== 'todo'; });
    var h = '<header class="top"><button class="link" data-act="toPre">‹ Overview</button><div class="eyebrow">Exercise ' + (s.idx + 1) + ' of ' + s.items.length + '</div><button class="link" data-act="quitAsk">Exit</button></header>';
    h += exHeadHtml(it, lastTxt ? '<div class="muted num">Last time: ' + esc(lastTxt) + '</div>' : '');
    h += '<div class="stack">';
    it.sets.forEach(function (st, j) {
      var label = st.status === 'done' ? 'Done' : st.status === 'skipped' ? 'Skipped' : '';
      var tt = targetText(st, it);
      h += '<div class="card set st-' + st.status + '"><div class="set-top"><span class="set-n">Set ' + (j + 1) + ' of ' + it.sets.length + '</span><span class="set-s">' + label + '</span></div>' +

        '<div class="set-btns"><button class="btn did ' + (st.status === 'done' ? 'on' : '') + '" data-act="mark" data-j="' + j + '" data-s="done">' + (st.status === 'done' ? '✓ Did it' : 'Did it') + '</button>' +
        '<button class="btn didnt ' + (st.status === 'skipped' ? 'on' : '') + '" data-act="mark" data-j="' + j + '" data-s="skipped">Didn’t do it</button></div></div>';
    });
    h += '<section class="card"><div class="eyebrow" style="margin-bottom:6px">This workout</div><div class="rows">';

      h += '<button class="row" data-act="jump" data-i="' + i + '"><span class="mdot" style="background:' + mcol(x.muscle) + '"></span><div class="grow"><div class="nm" style="' + (i === s.idx ? 'color:var(--accent)' : '') + '">' + esc(x.name) + '</div></div><span class="muted num">' + d + '/' + x.sets.length + '</span></button>';
    });

    h += '<div class="card"><div class="eyebrow" style="margin-bottom:8px">Rest between sets</div><div class="set-grid"><div>' + stepper('r:0:0:rest', restSecs(), 'seconds', 'r') + '</div></div></div>';
    h += '</div>';

      : '<button class="btn ' + (all ? 'btn-primary' : 'btn-ghost') + '" style="flex:1" data-act="nextEx">Next exercise ›</button>';
    return h + dock(s, nav);
  }
  function restBarHtml(s) {
    if (!s.restEnd) return '';
    var rem = Math.max(0, Math.ceil((s.restEnd - Date.now()) / 1000));
    return '<div class="rest ' + (rem === 0 ? 'done' : '') + '" id="rest-bar" role="timer"><div class="rest-fill" id="rest-fill" style="width:' + restPct(s) + '%"></div><div class="rest-in"><div><div class="eyebrow" id="rest-label">' + (rem === 0 ? 'Rest over. Next set.' : 'Rest') + '</div><div class="rest-time display num" id="rest-time">' + fmtClock(rem) + '</div></div>' +
      '<div class="rest-btns"><button data-act="restAdd" data-d="-15" aria-label="Subtract 15 seconds">−15</button><button data-act="restAdd" data-d="15" aria-label="Add 15 seconds">+15</button><button data-act="restSkip" id="rest-skip">' + (rem === 0 ? 'OK' : 'Skip') + '</button></div></div></div>';
  }
  function restPct(s) {
    var tot = (s.restTotal || restSecs()) * 1000;
    return Math.max(0, Math.min(100, ((s.restEnd - Date.now()) / tot) * 100)).toFixed(1);
  }

  function loadPoints(sessions) {
    return sessions.map(function (x) { return { ts: x.finishedAt, v: volumeOf(x), timed: false }; });
  }
  function deltaHtml(diff, pv) {
    var pct = pv ? Math.round(diff / pv * 100) : 0;
    return '<span class="' + (diff >= 0 ? 'up' : 'down') + '">' + (diff >= 0 ? '▲ +' : '▼ −') + fmtKg(Math.abs(diff)) + ' kg' + (pv ? ' (' + (diff >= 0 ? '+' : '−') + Math.abs(pct) + '%)' : '') + '</span>';
  }

  function summaryView() {
    var s = byId('sessions', state.view.sid);
    if (!s) return homeView();
    var done = 0, total = 0, prs = [];
    var vol = volumeOf(s);
    s.items.forEach(function (it) {
      it.sets.forEach(function (x) { total++; if (x.status === 'done') done++; });
      var cur = it.sets.filter(function (x) { return x.status === 'done'; });
      if (!cur.length) return;
      var timed = it.mode === 'time';
      var curBest = Math.max.apply(null, cur.map(function (x) { return timed ? x.secs : x.kg; }));
      var prev = history(it.exId, s.id);
      if (prev.length && curBest > Math.max.apply(null, prev.map(function (p) { return p.v; }))) prs.push(it.name);
    });
    var kcal = s.kcal != null ? s.kcal : Math.round(kcalFor(workMs(s)));
    var h = '<header class="top"><span></span><div class="eyebrow">Workout complete</div><span></span></header>';
    h += '<h1 class="display">' + esc(s.routineName) + '</h1><div class="muted" style="margin:6px 0 16px">' + esc(fmtDateLong(s.finishedAt)) + '</div>';
    h += '<div class="stats two"><div class="stat"><div class="v num">' + fmtDur(workMs(s)) + '</div><div class="l">Time</div></div>' +
      '<div class="stat"><div class="v num">' + done + '/' + total + '</div><div class="l">Sets</div></div>' +
      '<div class="stat"><div class="v num">' + fmtKg(vol) + '</div><div class="l">kg lifted</div></div>' +
      '<div class="stat"><div class="v num">' + kcal + '</div><div class="l">kcal (estimate)</div></div></div>';
    var same = D('sessions').filter(function (x) { return x.finishedAt && x.routineId === s.routineId && x.finishedAt <= s.finishedAt; })
      .sort(function (a, b) { return a.finishedAt - b.finishedAt; });
    var prevS = prevSame(s);
    h += '<section class="card" style="margin-top:14px"><div class="eyebrow">Total load</div><div class="bestnum num" style="margin-top:6px">' + fmtKg(vol) + '<small>kg</small></div>' +
      (prevS ? '<div class="num" style="margin-top:4px">' + deltaHtml(vol - volumeOf(prevS), volumeOf(prevS)) + ' <span class="muted">vs ' + esc(fmtDate(prevS.finishedAt)) + '</span></div>' : '<div class="muted" style="margin-top:4px">First time on this routine. Next time you will see the change.</div>') +
      (same.length > 1 ? areaChart(loadPoints(same), fmtKg, 'Total load over time') : '') + '</section>';
    if (prs.length) {
      h += '<div class="card" style="margin-top:14px"><div class="pr">New best</div>' + prs.map(function (n) { return '<div class="nm" style="margin-top:6px">' + esc(n) + '</div>'; }).join('') + '</div>';
    }
    h += '<div class="card" style="margin-top:14px"><div class="rows">' + s.items.map(function (it) {
      var d = it.sets.filter(function (x) { return x.status === 'done'; });
      return '<div class="row"><span class="mdot" style="background:' + mcol(it.muscle) + '"></span><div class="grow"><div class="nm">' + esc(it.name) + '</div><div class="sub num">' + (d.length ? esc(d.map(function (x) { return it.mode === 'time' ? x.secs + ' s' : kgText(x.kg) + 'x' + x.reps; }).join('  ')) : 'Not done') + '</div></div></div>';
    }).join('') + '</div></div>';
    return h + bar('<button class="btn btn-primary wide" data-act="go" data-to="home">Done</button>');
  }

  function progressView() {
    var h = '<header class="top"><div><div class="eyebrow">Your numbers</div><h1 class="display">Progress</h1></div></header>';
    h += '<div class="seg seg4" style="margin-bottom:14px"><button class="' + (state.ptab === 'exercises' ? 'on' : '') + '" data-act="ptab" data-t="exercises">Exercises</button><button class="' + (state.ptab === 'workouts' ? 'on' : '') + '" data-act="ptab" data-t="workouts">Workouts</button><button class="' + (state.ptab === 'load' ? 'on' : '') + '" data-act="ptab" data-t="load">Load</button><button class="' + (state.ptab === 'body' ? 'on' : '') + '" data-act="ptab" data-t="body">Body</button></div>';
    var fin = D('sessions').filter(function (s) { return s.finishedAt; });
    if (state.ptab === 'body') return h + bodyTab() + tabbar('progress');
    if (state.ptab === 'exercises') {
      var rows = D('exercises').map(function (e) { return { e: e, h: history(e.id) }; })
        .filter(function (x) { return x.h.length; })
        .sort(function (a, b) { return b.h[b.h.length - 1].ts - a.h[a.h.length - 1].ts; });
      if (!rows.length) return h + '<div class="card empty"><h2 class="display">Nothing logged yet</h2><div>Finish a workout and your weight progression shows up here.</div></div>' + tabbar('progress');
      h += '<div class="card"><div class="rows">' + rows.map(function (x) {
        var b = x.h.reduce(function (a, c) { return c.v > a.v ? c : a; });
        return '<button class="row" data-act="openEx" data-id="' + esc(x.e.id) + '"><span class="mdot" style="background:' + mcol(x.e.muscle) + '"></span><div class="grow"><div class="nm">' + esc(x.e.name) + '</div><div class="sub num">Best ' + esc(bestText(b)) + ' · ' + x.h.length + ' session' + (x.h.length === 1 ? '' : 's') + '</div></div>' + sparkline(x.h) + '</button>';
      }).join('') + '</div></div>';
    } else if (state.ptab === 'workouts') {
      var ss = fin.slice().sort(function (a, b) { return b.finishedAt - a.finishedAt; });
      if (!ss.length) return h + '<div class="card empty"><h2 class="display">No workouts yet</h2><div>Completed workouts are listed here, newest first.</div></div>' + tabbar('progress');
      h += '<div class="card"><div class="rows">' + ss.map(function (s) {
        var d = 0, t = 0; s.items.forEach(function (i) { i.sets.forEach(function (x) { t++; if (x.status === 'done') d++; }); });
        return '<button class="row" data-act="openSession" data-id="' + esc(s.id) + '"><div class="grow"><div class="nm">' + esc(s.routineName) + '</div><div class="sub num">' + esc(fmtDateLong(s.finishedAt)) + ' · ' + d + '/' + t + ' sets · ' + fmtDur(workMs(s)) + ' · ' + fmtKg(volumeOf(s)) + ' kg</div></div><span class="muted">›</span></button>';
      }).join('') + '</div></div>';
    } else {
      var rs = D('routines').slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      var sel = state.loadR && rs.some(function (r) { return r.id === state.loadR; }) ? state.loadR : 'all';
      h += '<div class="chips" style="margin-bottom:12px"><button class="chip ' + (sel === 'all' ? 'on' : '') + '" data-act="loadR" data-id="all">All</button>' +
        rs.map(function (r) { return '<button class="chip ' + (sel === r.id ? 'on' : '') + '" data-act="loadR" data-id="' + esc(r.id) + '">' + esc(r.name) + '</button>'; }).join('') + '</div>';
      var list = fin.filter(function (s) { return sel === 'all' || s.routineId === sel; }).sort(function (a, b) { return a.finishedAt - b.finishedAt; });
      if (!list.length) return h + '<div class="card empty"><h2 class="display">No load yet</h2><div>Total weight lifted per workout is charted here once you finish one.</div></div>' + tabbar('progress');
      var pts = loadPoints(list), first = pts[0].v, lastV = pts[pts.length - 1].v;
      h += '<section class="card"><div class="eyebrow">Total load per workout</div><div class="bestnum num" style="margin-top:6px">' + fmtKg(lastV) + '<small>kg</small></div>' +
        (pts.length > 1 ? '<div class="num">' + deltaHtml(lastV - first, first) + ' <span class="muted">since the first</span></div>' + areaChart(pts, fmtKg, 'Total load over time') : '<div class="muted">One workout so far. The chart appears after the next one.</div>') + '</section>';
      h += '<h2 class="display sec">Workouts</h2><div class="card"><div class="rows">' + list.slice().reverse().map(function (s) {
        var pv = prevSame(s);
        return '<button class="row" data-act="openSession" data-id="' + esc(s.id) + '"><div class="grow"><div class="nm">' + esc(s.routineName) + '</div><div class="sub num">' + esc(fmtDateLong(s.finishedAt)) + '</div></div><div style="text-align:right"><div class="nm num">' + fmtKg(volumeOf(s)) + ' kg</div>' + (pv ? '<div class="sub num">' + deltaHtml(volumeOf(s) - volumeOf(pv), volumeOf(pv)) + '</div>' : '') + '</div></button>';
      }).join('') + '</div></div>';
    }
    return h + tabbar('progress');
  }

  /* ---------- body composition (scale reports) ---------- */
  var SCAN_FIELDS = [
    ['weight', 'Weight', 'kg', 1], ['bodyFat', 'Body fat', '%', 1], ['muscle', 'Muscle mass', 'kg', 1], ['fatKg', 'Fat mass', 'kg', 1],
    ['skeletal', 'Skeletal muscle', 'kg', 1], ['bmi', 'BMI', '', 1], ['visceral', 'Visceral fat', '', 0], ['bmr', 'Metabolic rate', 'kcal', 0],
    ['water', 'Water', 'kg', 1], ['protein', 'Protein', 'kg', 1], ['bone', 'Bone mass', 'kg', 1], ['ffm', 'Fat-free mass', 'kg', 1],
    ['subq', 'Subcutaneous fat', '%', 1], ['asmi', 'ASMI', 'kg/m²', 1], ['bodyAge', 'Body age', '', 0], ['whr', 'Waist-hip ratio', '', 2], ['score', 'Body score', '/100', 0]
  ];
  var SCAN_KEY = {
    weight: 'weight_kg', bodyFat: 'body_fat_percent', muscle: 'muscle_mass_kg', fatKg: 'fat_mass_kg', skeletal: 'skeletal_muscle_kg', bmi: 'bmi',
    visceral: 'visceral_fat_grade', bmr: 'basal_metabolic_rate_kcal', water: 'water_kg', protein: 'protein_kg', bone: 'bone_mass_kg', ffm: 'fat_free_mass_kg',
    subq: 'subcutaneous_fat_percent', asmi: 'asmi', bodyAge: 'body_age', whr: 'waist_hip_ratio', score: 'body_score'
  };
  var SEG_PARTS = [['la', 'left_arm', 'Left arm'], ['ra', 'right_arm', 'Right arm'], ['tr', 'trunk', 'Trunk'], ['ll', 'left_leg', 'Left leg'], ['rl', 'right_leg', 'Right leg']];
  function fmtMetric(f, v, short) {
    var n = (Math.round(v * Math.pow(10, f[3])) / Math.pow(10, f[3])).toFixed(f[3]);
    if (f[3] === 1) n = String(parseFloat(n));
    if (n === 'NaN') return '';
    var u = f[2];
    if (!u) return n;
    return u === '%' ? n + '%' : n + (short && u === 'kg' ? ' kg' : ' ' + u);
  }
  function scanFromInput(inp) {
    var e = { ts: Date.now() };
    var t = Date.parse(String(inp.test_date || '').replace(' ', 'T'));
    if (isFinite(t) && t > Date.UTC(2015, 0, 1) && t < Date.now() + 864e5) e.ts = t;
    SCAN_FIELDS.forEach(function (f) {
      var v = parseFloat(inp[SCAN_KEY[f[0]]]);
      if (isFinite(v) && v > 0 && v < 100000) e[f[0]] = Math.round(v * 100) / 100;
    });

  function num(v, lo, hi, dflt) { var n = parseFloat(v); if (!isFinite(n)) return dflt; return Math.min(hi, Math.max(lo, n)); }
  function coachTools(bot) {
    return [
      {
        name: 'propose_routine',
        description: 'Show the person a routine proposal card with Apply and Dismiss buttons. Nothing changes until they tap Apply. Use for a new routine, or set replaces_routine_id to the id of an existing routine to propose a replacement for it. Returns a short confirmation.',
        inputSchema: {
          type: 'object',
          properties: {
            name: { type: 'string', description: 'Routine name, e.g. "1 Push"' },
            replaces_routine_id: { type: 'string', description: 'Optional id (in square brackets in the routine list) of the routine this replaces' },
            exercises: {
              type: 'array',
              description: 'Exercises in order',
              items: {
                type: 'object',
                properties: {
                  name: { type: 'string' },
                  muscle: { type: 'string', description: 'One of Chest, Back, Shoulders, Biceps, Triceps, Legs, Glutes, Core, Other' },
                  sets: { type: 'number' },
                  reps_min: { type: 'number' },
                  reps_max: { type: 'number' },
                  weight_kg: { type: 'number', description: 'Starting weight in kg, 0 if unknown' },
                  seconds: { type: 'number', description: 'Only for timed holds like plank; omit reps then' }
                },
                required: ['name', 'sets']
              }
            }
          },
          required: ['name', 'exercises']
        },
        execute: function (input) {
          var list = Array.isArray(input.exercises) ? input.exercises : [];
          if (!list.length) throw new Error('exercises must not be empty');
          var items = list.slice(0, 14).map(function (e) {
            var name = String(e.name || '').trim().slice(0, 50);
            if (!name) throw new Error('every exercise needs a name');
            var known = D('exercises').find(function (x) { return x.name.toLowerCase() === name.toLowerCase(); });
            var fromLib = !known && LIBNAME[name.toLowerCase()];
            var muscle = known ? known.muscle : (fromLib ? libGroup(fromLib) : (MUSCLES.indexOf(e.muscle) >= 0 ? e.muscle : 'Other'));
            var secs = num(e.seconds, 0, 600, 0);
            var rmin = Math.round(num(e.reps_min, 1, 50, 8)), rmax = Math.round(num(e.reps_max, 1, 50, rmin));
            if (rmax < rmin) rmax = rmin;
            return { name: known ? known.name : name, muscle: muscle, sets: Math.round(num(e.sets, 1, 8, 3)), repsMin: rmin, repsMax: rmax, kg: num(e.weight_kg, 0, 500, 0), secs: secs && !e.reps_min ? Math.round(secs) : 0 };
          });
          var rid = input.replaces_routine_id && byId('routines', String(input.replaces_routine_id)) ? String(input.replaces_routine_id) : '';
          bot.proposals.push({ kind: 'routine', name: String(input.name || 'New routine').slice(0, 40), replaceId: rid, items: items, status: 'pending' });
          softRender();
          return 'Proposal shown to the person with Apply and Dismiss buttons. It is not applied yet.';
        }
      },
      scanTool('propose_measurement', 'Show the person a card to save body-composition numbers (for example read from a smart-scale report screenshot) to their body log. Nothing is saved until they tap Save.', function (e) {
        bot.proposals.push({ kind: 'measure', scan: e, status: 'pending' });
        softRender();
      })
    ];
  }

      var n = p ? newSetFor(it, p) : { kg: 0, reps: 10, tMin: 10, tMax: 10, secs: 0 };
      n.status = 'todo'; it.sets.push(n); put('sessions', s); render();
    },
    wDelSet: function () { var s = activeSession(), it = s.items[s.idx]; if (it.sets.length > 1) { it.sets.pop(); put('sessions', s); render(); } },
    mark: function (d) {
      var s = activeSession(), it = s.items[s.idx], st = it.sets[+d.j];
      if (st.status === d.s) { st.status = 'todo'; }
      else {
        st.status = d.s;
        if (d.s === 'done') {
          sfx(it.sets.every(function (y) { return y.status !== 'todo'; }) ? 'exercise' : 'set');
          var everything = s.items.every(function (x) { return x.sets.every(function (y) { return y.status !== 'todo'; }); });
          if (!everything) startRest(s);
        }
      }
      put('sessions', s); render();
    },
    jump: function (d) { var s = activeSession(); s.idx = +d.i; s.stage = 'pre'; put('sessions', s); state.noteOpen = false; state.sheet = null; render(); try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } },
    nextEx: function () {
      var s = activeSession(), n = nextIdx(s);
      if (n < 0) { A.finishAsk(); return; }
      s.idx = n; s.stage = 'pre'; state.noteOpen = false; put('sessions', s); render(); try { window.scrollTo(0, 0); } catch (e) { /* ignore */ }
    },
    prevEx: function () { var s = activeSession(); if (s.idx > 0) { s.idx--; s.stage = 'pre'; state.noteOpen = false; put('sessions', s); render(); try { window.scrollTo(0, 0); } catch (e) { /* ignore */ } } },
    restAdd: function (d) { var s = activeSession(); if (!s || !s.restEnd) return; s.restEnd = Math.max(Date.now(), s.restEnd + (+d.d) * 1000); s.restTotal = (s.restTotal || 90) + (+d.d > 0 ? +d.d : 0); beeped = false; put('sessions', s); tick(); },
    restSkip: function () { var s = activeSession(); if (!s) return; s.restEnd = null; put('sessions', s); render(); },
    finishAsk: function () {
      var s = activeSession(), pending = 0;
      s.items.forEach(function (it) { it.sets.forEach(function (x) { if (x.status === 'todo') pending++; }); });
      state.sheet = { type: 'finish', pending: pending }; render();
    },
    finish: function () {
      var s = activeSession(); if (!s) return;
      s.finishedAt = Date.now(); s.restEnd = null; s.pausedAt = null;
      s.kcal = Math.round(kcalFor(workMs(s)));
      put('sessions', s); stopTicker(); releaseWake(); sfx('finish');
      go('summary', { sid: s.id });
    },
    ptab: function (d) { state.ptab = d.t; render(); },
    loadR: function (d) { state.loadR = d.id; render(); },
    openEx: function (d) { go('exercise', { id: d.id }); },
    openSession: function (d) { go('session', { id: d.id }); },
    back2progress: function () { go('progress'); },
    libSide: function (d) { state.libSide = d.v; render(); },
    libMuscle: function (d) { state.libM = d.m; state.libEq = 'All'; go('libMuscle', { id: d.m }); },
    libEq: function (d) { state.libEq = d.v; render(); },
    openLib: function (d) { state.libFrom = state.view.name === 'libMuscle' ? 'muscle' : 'search'; go('libEx', { id: d.id }); },
    soundSet: function (d) { saveSetting({ sound: d.v === '1' }); if (d.v === '1') sfx('set'); render(); },
    syGo: function () { syncConnect(); },
    syNow: function () { clearTimeout(SYNC.timer); syncPush(); render(); },
    syOff: function () { SYNC.cfg = null; lsSet('liftlog.sync', null); lsSet('liftlog.sync.sha', null); lsSet('liftlog.sync.dirty', null); lsSet('liftlog.sync.at', null); SYNC.sha = ''; SYNC.err = ''; state.syMsg = 'Disconnected. Your data stays on this phone.'; state.syRepo = ''; render(); },
    syLoad: function () { var cur = state.syFound; state.syFound = null; if (cur) { var err = applyRemote(cur); state.syMsg = err || 'Loaded from GitHub.'; } render(); },
    syKeep: function () { state.syFound = null; SYNC.sha = ''; syncPush().then(function () { state.syMsg = SYNC.err || 'This phone\'s data is now saved to GitHub.'; render(); }); },
    mfOpen: function () { state.manual = true; state.mf = {}; state.mfErr = ''; render(); },
    mfCancel: function () { state.manual = false; state.mfErr = ''; render(); },
    mfSave: function () { mfSave(); },
    bkCopy: function () {
      var txt = JSON.stringify(backupObj());
      var done = function () { state.bkMsg = 'Backup copied. Paste it somewhere safe, such as Notes.'; render(); };
      var fall = function () { state.bkText = txt; state.bkMsg = 'Could not copy automatically. Select the text below and copy it.'; render(); var t = document.getElementById('bk-in'); if (t) { t.focus(); t.select(); } };
      try { navigator.clipboard.writeText(txt).then(done, fall); } catch (e) { fall(); }
    },
    bkFile: function () {
      var txt = JSON.stringify(backupObj()), name = 'lift-log-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      try {
        var file = new File([txt], name, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); return; }
        var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
        setTimeout(function () { a.remove(); }, 500);
        state.bkMsg = 'Backup file saved.'; render();
      } catch (e) { state.bkMsg = 'Could not make a file here. Use Copy backup instead.'; render(); }
    },
    bkAsk: function () {
      if (!state.bkText.trim()) { state.bkMsg = 'Paste a backup into the box first, or choose a file.'; render(); return; }
      state.bkMsg = ''; state.bkAsk = true; render();
    },
    bkNo: function () { state.bkAsk = false; render(); },
    bkGo: function () {
      var err = restoreFrom(state.bkText);
      state.bkAsk = false;
      if (err) state.bkMsg = err; else { state.bkMsg = 'Restored.'; state.bkText = ''; toast('Backup restored'); }
      render();
    },
    scanOpen: function (d) { go('metric', { k: d.k }); },
    metricBack: function () { state.ptab = 'body'; go('progress'); },
    scanMetric: function (d) { state.scanMetric = d.k; render(); },
    delScanAsk: function (d) { state.sheet = { type: 'delScan', ts: +d.ts }; render(); },
    delScan: function (d) {
      var b = byId('settings', 'body'); if (!b) return;
      var t = +d.ts; b = clone(b); b.log = (b.log || []).filter(function (x) { return x.ts !== t; });
      put('settings', b); state.sheet = null; toast('Report removed'); render();
    },
    scanSave: function () { if (state.scanDraft) { saveScan(state.scanDraft); state.scanDraft = null; toast('Saved to body log'); render(); } },
    scanDiscard: function () { state.scanDraft = null; state.scanErr = ''; render(); },
    exInfo: function (d) { go('exInfo', { id: d.id }); },
    exInfoBack: function () { go('workout'); },
    libBack: function () { if (state.libFrom === 'muscle' && state.libM) go('libMuscle', { id: state.libM }); else go('library'); },
    toggleForm: function () { state.formOpen = !state.formOpen; render(); },
    pickLib: function (d) { var l = LIBBY[d.id]; if (!l) return; var ex = ensureLibEx(l); A.pickEx({ id: ex.id }); },
    addTo: function (d) { state.sheet = { type: 'addTo', lib: d.id }; render(); },
    addToRoutine: function (d) {
      var l = LIBBY[d.lib], r = byId('routines', d.rid); if (!l || !r) return;
      var ex = ensureLibEx(l);
      state.sheet = null;
      if (r.items.some(function (it) { return it.exId === ex.id; })) { toast('Already in ' + r.name); return; }
      var def = defaultSetsFor(ex);
      r.items.push({ exId: ex.id, mode: def.mode, sets: def.sets });
      put('routines', r); toast('Added to ' + r.name);
    },
    newFromLib: function (d) {
      var l = LIBBY[d.lib]; if (!l) return;
      var ex = ensureLibEx(l), def = defaultSetsFor(ex);
      state.draft = { id: uid(), name: '', order: D('routines').reduce(function (m, x) { return Math.max(m, x.order || 0); }, 0) + 1, items: [{ exId: ex.id, mode: def.mode, sets: def.sets }], isNew: true };
      go('editor');
    },
    setSex: function (d) { saveSetting({ sex: d.v }); render(); },
    setEffort: function (d) { saveSetting({ effort: d.v }); render(); },
    suggest: function (d) { coach.draft = d.t; render(); var el = document.getElementById('chat-in'); if (el) el.focus(); },
    sendChat: function () { sendChat(); },
    stopChat: function () { if (coach.ctl) coach.ctl.abort(); },
    clearChat: function () { coach.chat = []; removeDoc('settings', 'chat'); render(); },
    rmFile: function (d) { var i = +d.i; try { URL.revokeObjectURL(coach.urls[i]); } catch (e) { /* ignore */ } coach.files.splice(i, 1); coach.urls.splice(i, 1); render(); },
    applyProp: function (d) { applyProp(+d.m, +d.p); },
    dismissProp: function (d) {
      var m = coach.chat[+d.m], p = m && m.proposals && m.proposals[+d.p];
      if (p && p.status === 'pending') { p.status = 'dismissed'; saveChat(); render(); }
    }
  };

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || !app.contains(t) || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return;
    if (t.disabled) return;
    var fn = A[t.dataset.act];
    if (fn) fn(t.dataset, t, e);
  });
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button') {
      e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    }
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.act === 'type') {
      applyValue(t.dataset.k, parseNum(t.value)); render();
    } else if (t.id === 'note-ta') {
      var s = activeSession(); if (!s) return;
      var ex = exOf(s.items[s.idx].exId); if (!ex) return;
      ex.note = t.value.trim(); put('exercises', ex);
    } else if (t.id === 'scan-file') {
      var f0 = t.files && t.files[0]; try { t.value = ''; } catch (er) { /* ignore */ }
      if (f0) importScan(f0);
    } else if (t.id === 'bk-file') {
      var bf = t.files && t.files[0]; try { t.value = ''; } catch (er) { /* ignore */ }
      if (bf) { var rd = new FileReader(); rd.onload = function () { state.bkText = String(rd.result || ''); state.bkMsg = ''; state.bkAsk = true; render(); }; rd.readAsText(bf); }
    } else if (t.id === 'chat-file') {
      addFiles(t.files); try { t.value = ''; } catch (er) { /* ignore */ }
    }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.act === 'draftName') state.draft.name = t.value;
    else if (t.id === 'pick-q') { state.picker.q = t.value; var l = document.getElementById('pick-list'); if (l) l.innerHTML = pickList(); }
    else if (t.id === 'custom-name') state.picker.customName = t.value;
    else if (t.id === 'lib-q') { state.libQ = t.value; var lb = document.getElementById('lib-body'); if (lb) lb.innerHTML = libBody(); }
    else if (t.id === 'chat-in') coach.draft = t.value;
    else if (t.id === 'bk-in') state.bkText = t.value;
    else if (t.id === 'sy-repo') state.syRepo = t.value;
    else if (t.id === 'sy-token') state.syToken = t.value;
    else if (t.id && t.id.indexOf('mf-') === 0) state.mf[t.id.slice(3)] = t.value;
  });
  app.addEventListener('paste', function (e) {
    if (e.target.id !== 'chat-in' || !e.clipboardData || !e.clipboardData.files || !e.clipboardData.files.length) return;
    e.preventDefault(); addFiles(e.clipboardData.files);
  });
  document.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    if (state.view.name === 'coach' && coach.sample) addFiles(e.dataTransfer.files);
  });
  app.addEventListener('focusin', function (e) { if (e.target.classList && e.target.classList.contains('sv')) { try { e.target.select(); } catch (er) { /* ignore */ } } });
  app.addEventListener('focusout', function () {
    if (!pendingRender) return;
    setTimeout(function () { if (pendingRender && !focusedInput()) render(); }, 0);
  });

  /* drag to reorder exercises in the editor (hold the four dots) */
  var drag = null;
  var raf = window.requestAnimationFrame ? function (f) { window.requestAnimationFrame(f); } : function (f) { setTimeout(f, 16); };
  function dragFrame() {
    if (!drag) return;
    var d = drag, dy = d.y - d.startY + (window.scrollY - d.scroll0);
    d.el.style.transform = 'translateY(' + dy + 'px)';
    var center = d.rects[d.i].top + d.rects[d.i].height / 2 + dy, to = 0;
    d.rects.forEach(function (r, k) { if (k !== d.i && r.top + r.height / 2 < center) to++; });
    d.to = to;
    d.cards.forEach(function (c, k) {
      if (k === d.i) return;
      var s = 0;
      if (d.i < k && k <= to) s = -d.h; else if (to <= k && k < d.i) s = d.h;
      c.style.transform = s ? 'translateY(' + s + 'px)' : '';
    });
    var vh = window.innerHeight || 800;
    if (d.y < 90) window.scrollBy(0, -12); else if (d.y > vh - 90) window.scrollBy(0, 12);
    raf(dragFrame);
  }
  app.addEventListener('pointerdown', function (e) {
    var g = e.target.closest && e.target.closest('[data-drag]');
    if (!g || state.view.name !== 'editor' || drag) return;
    var i = +g.dataset.drag, cards = Array.prototype.slice.call(app.querySelectorAll('[data-card]'));
    var el = cards[i]; if (!el) return;
    e.preventDefault();
    var rects = cards.map(function (c) { return c.getBoundingClientRect(); });
    drag = { i: i, to: i, el: el, cards: cards, rects: rects, startY: e.clientY, y: e.clientY, scroll0: window.scrollY || 0, h: rects[i].height + 14 };
    el.classList.add('dragging');
    cards.forEach(function (c, k) { if (k !== i) c.classList.add('shift'); });
    try { g.setPointerCapture(e.pointerId); } catch (er) { /* optional */ }
    raf(dragFrame);
  });
  document.addEventListener('pointermove', function (e) { if (drag) { drag.y = e.clientY; e.preventDefault(); } });
  function dragEnd() {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.to !== d.i && state.draft) {
      var it = state.draft.items.splice(d.i, 1)[0];
      state.draft.items.splice(d.to, 0, it);
    }
    render();
  }
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);

  async function initSample() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      var f = await window.claude.use('sample');
      if (!f) return;
      coach.sample = f;
      try { coach.limits = await f.limits(); } catch (e) { coach.limits = null; }
      softRender();
    } catch (e) { /* coach stays hidden */ }
  }

  render();
  initStore();
  initSample();
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.LIFTLOG_STANDALONE) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* ignore */ }
})();
</script>
